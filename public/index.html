<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="alternate icon" href="/favicon.ico">
    <title>礼记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        /* 登录页面样式 */
        #login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 50px;
            max-width: 450px;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header h1 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .login-form {
            margin-bottom: 20px;
        }

        .login-form-group {
            margin-bottom: 20px;
        }

        .login-form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        .login-form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .login-form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .error-message {
            color: #ff4757;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .success-message {
            color: #52c41a;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }

        .change-password-link {
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
        }

        .change-password-link:hover {
            text-decoration: underline;
        }

        #app-container {
            display: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f7f7f7;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f7f7f7;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab:hover {
            background: #ececec;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            margin-left: 10px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .records-list {
            margin-top: 30px;
        }

        .record-card {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .record-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .record-card.received {
            border-left-color: #52c41a;
        }

        .record-card.given {
            border-left-color: #ff4757;
        }

        .record-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .record-name {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .record-amount {
            font-size: 20px;
            font-weight: bold;
        }

        .record-amount.received {
            color: #52c41a;
        }

        .record-amount.given {
            color: #ff4757;
        }

        .record-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .record-detail {
            display: flex;
            align-items: center;
        }

        .record-detail strong {
            margin-right: 5px;
        }

        .record-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 15px;
            font-size: 12px;
        }

        .btn-delete {
            background: #ff4757;
            color: white;
        }

        .btn-delete:hover {
            background: #ee5a6f;
        }

        .btn-return {
            background: #52c41a;
            color: white;
        }

        .btn-return:hover {
            background: #73d13d;
        }

        .statistics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card:nth-child(2) {
            background: linear-gradient(135deg, #52c41a 0%, #95de64 100%);
        }

        .stat-card:nth-child(3) {
            background: linear-gradient(135deg, #ff4757 0%, #ff6348 100%);
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .filter-bar select, .filter-bar input {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state img {
            width: 150px;
            opacity: 0.3;
            margin-bottom: 20px;
        }

        .contact-group {
            margin-bottom: 30px;
        }

        .contact-group-title {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .contact-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .contact-item {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .contact-item:hover {
            background: #fff;
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .contact-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 8px;
            color: #333;
        }

        .contact-stats {
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
        }

        .contact-balance {
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }

        .contact-balance.positive {
            color: #52c41a;
        }

        .contact-balance.negative {
            color: #ff4757;
        }

        .year-stat-card {
            flex: 1;
            min-width: 200px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            text-align: center;
        }

        .year-stat-card:hover {
            background: #fff;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .year-stat-card.active {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .year-stat-year {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .year-stat-amount {
            font-size: 18px;
            margin: 5px 0;
        }

        .year-stat-count {
            font-size: 14px;
            opacity: 0.8;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            animation: modalSlideIn 0.3s;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f0f0f0;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: #e0e0e0;
            transform: rotate(90deg);
        }

        #contact-suggestions, .guest-suggestions {
            margin-top: 2px;
        }

        .suggestion-item {
            padding: 10px 15px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .suggestion-item:hover {
            background: #f5f5f5;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-name {
            font-weight: bold;
            color: #333;
        }

        .suggestion-info {
            font-size: 12px;
            color: #999;
            margin-top: 3px;
        }

        .sortable-header {
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }

        .sortable-header:hover {
            background: #e6f7ff !important;
        }

        .sort-indicator {
            font-size: 10px;
            margin-left: 4px;
            color: #1890ff;
        }

        .preset-btns {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 4px 12px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: #1890ff;
            color: #1890ff;
        }

        .preset-btn:active {
            background: #e6f7ff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }

        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
        }

        .status-returned {
            background: #f6ffed;
            color: #52c41a;
        }

        @media (max-width: 768px) {
            .form-row, .record-details, .statistics {
                grid-template-columns: 1fr;
            }

            .record-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .record-amount {
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page">
        <div class="login-container">
            <div class="login-header">
                <h1>🔐 礼记系统</h1>
                <p>请输入密码访问</p>
            </div>
            <form id="login-form" class="login-form" onsubmit="return handleLogin(event)">
                <div class="login-form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required autofocus>
                </div>
                <button type="submit" class="login-btn">登录</button>
                <div id="login-message"></div>
            </form>
            <div class="change-password-link" onclick="showChangePasswordForm()">
                修改密码
            </div>
        </div>
    </div>

    <!-- 修改密码页面 -->
    <div id="change-password-page" style="display: none;">
        <div class="login-container">
            <div class="login-header">
                <h1>🔑 修改密码</h1>
                <p>请输入旧密码和新密码</p>
            </div>
            <form id="change-password-form" class="login-form" onsubmit="return handleChangePassword(event)">
                <div class="login-form-group">
                    <label for="old-password">旧密码</label>
                    <input type="password" id="old-password" placeholder="请输入旧密码" required>
                </div>
                <div class="login-form-group">
                    <label for="new-password">新密码</label>
                    <input type="password" id="new-password" placeholder="请输入新密码" required>
                </div>
                <div class="login-form-group">
                    <label for="confirm-password">确认密码</label>
                    <input type="password" id="confirm-password" placeholder="请再次输入新密码" required>
                </div>
                <button type="submit" class="login-btn">修改密码</button>
                <button type="button" class="btn btn-secondary" style="width: 100%; margin-top: 10px;" onclick="backToLogin()">返回登录</button>
                <div id="change-password-message"></div>
            </form>
        </div>
    </div>

    <!-- 主应用容器 -->
    <div id="app-container">
    <div class="container">
        <div class="header">
            <h1 id="app-title">💝 礼记</h1>
            <p>记录每一份情谊，管理随礼还礼</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('add')">📝 添加记录</button>
            <button class="tab" onclick="switchTab('list')">📋 记录列表</button>
            <button class="tab" onclick="switchTab('gift-book')">🎁 礼薄管理</button>
            <button class="tab" onclick="switchTab('stats')">📊 统计分析</button>
        </div>

        <div class="content">
            <!-- 添加记录 -->
            <div id="add-tab" class="tab-content active">
                <form id="record-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="type">记录类型 *</label>
                            <select id="type" required onchange="toggleGiftBookSelection()">
                                <option value="given">送礼（我给别人）</option>
                                <option value="received">收礼（别人给我）</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="name">姓名 *</label>
                            <input type="text" id="name" placeholder="请输入对方姓名" required autocomplete="off" oninput="showContactSuggestions()">
                            <div id="contact-suggestions" style="display: none; position: absolute; background: white; border: 1px solid #d9d9d9; border-radius: 4px; max-height: 200px; overflow-y: auto; z-index: 1000; box-shadow: 0 2px 8px rgba(0,0,0,0.15);"></div>
                        </div>
                    </div>

                    <div class="form-group" id="giftbook-selection" style="display: none;">
                        <label for="giftbook">关联礼薄</label>
                        <select id="giftbook" onchange="onGiftBookChange()">
                            <option value="">不关联礼薄</option>
                        </select>
                        <small style="color: #999; display: block; margin-top: 5px;">💡 选择礼薄后，此收礼记录将自动添加到对应礼薄中，并自动填充事由和日期</small>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="relationship">关系</label>
                            <input type="text" id="relationship" placeholder="如：同事、朋友、亲戚">
                            <div class="preset-btns">
                                <button type="button" class="preset-btn" onclick="document.getElementById('relationship').value='亲戚'">亲戚</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('relationship').value='朋友'">朋友</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('relationship').value='同学'">同学</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('relationship').value='同事'">同事</button>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="amount">金额 *</label>
                            <input type="number" id="amount" placeholder="请输入金额" min="0" step="0.01" required>
                            <div class="preset-btns">
                                <button type="button" class="preset-btn" onclick="document.getElementById('amount').value=100">100</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('amount').value=200">200</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('amount').value=500">500</button>
                                <button type="button" class="preset-btn" onclick="document.getElementById('amount').value=1000">1000</button>
                            </div>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="event">事由 *</label>
                            <select id="event" required>
                                <option value="wedding">结婚</option>
                                <option value="birthday">生日</option>
                                <option value="housewarming">乔迁</option>
                                <option value="baby">满月/百日</option>
                                <option value="visit">探病</option>
                                <option value="funeral">丧事</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="date">日期 *</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="location">地点</label>
                        <input type="text" id="location" placeholder="请输入地点">
                    </div>

                    <div class="form-group">
                        <label for="notes">备注</label>
                        <textarea id="notes" placeholder="可以添加一些备注信息..."></textarea>
                    </div>

                    <div style="text-align: center; margin-top: 30px;">
                        <button type="submit" class="btn btn-primary">💾 保存记录</button>
                        <button type="reset" class="btn btn-secondary">🔄 重置</button>
                    </div>
                </form>
            </div>

            <!-- 记录列表 -->
            <div id="list-tab" class="tab-content">
                <div class="filter-bar" style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
                    <select id="filter-type" onchange="filterRecords()">
                        <option value="all">全部记录</option>
                        <option value="received">收礼记录</option>
                        <option value="given">送礼记录</option>
                    </select>
                    <select id="filter-year" onchange="filterRecords()">
                        <option value="all">全部年份</option>
                    </select>
                    <input type="text" id="search-name" placeholder="搜索姓名..." onkeyup="filterRecords()">
                    <div style="margin-left: auto; display: flex; gap: 8px;">
                        <button class="btn btn-small" style="background: #52c41a; color: white;" onclick="exportToExcel()">
                            📤 导出 Excel
                        </button>
                        <button class="btn btn-small" style="background: #1890ff; color: white;" onclick="document.getElementById('import-file').click()">
                            📥 导入 Excel
                        </button>
                        <input type="file" id="import-file" accept=".csv,.xlsx,.xls" style="display: none;" onchange="importFromExcel(event)">
                    </div>
                </div>
                <div id="records-container" class="records-list"></div>
            </div>

            <!-- 礼薄管理 -->
            <div id="gift-book-tab" class="tab-content">
                <div style="text-align: center; margin-bottom: 20px;">
                    <button class="btn btn-primary" onclick="toggleGiftBookForm()" id="create-giftbook-btn">
                        ➕ 创建礼薄
                    </button>
                </div>

    <!-- 退出按钮 -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 999;">
        <button class="btn" style="background: rgba(255, 255, 255, 0.2); color: white; padding: 10px 20px;" onclick="logout()">
            🚪 退出登录
        </button>

    <script>
        // 密码管理
        let currentPassword = null;
        const DEFAULT_PASSWORD = 'admin';
        const SESSION_KEY = 'renqing-session';
        const FIRST_TIME_KEY = 'renqing-first-time';

        // 检查密码状态
        async function checkPasswordStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/password/status`);
                if (response.ok) {
                    return await response.json();
                }
                return { hasPassword: false, isFirstTime: true };
            } catch (error) {
                console.error('无法获取密码状态:', error);
                // 如果API不可用，降级到本地存储
                return {
                    hasPassword: !!localStorage.getItem('renqing-password'),
                    isFirstTime: !localStorage.getItem('renqing-password-changed')
                };
            }
        }

        // 验证密码
        async function verifyPassword(password) {
            try {
                console.log('Verifying password with API:', `${API_BASE}/api/password/verify`);
                const response = await fetch(`${API_BASE}/api/password/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                console.log('Password verification response:', response.status, response.statusText);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Password verification result data:', result);
                    return result.success;
                } else {
                    console.error('Password verification failed with status:', response.status);
                    // 如果API返回错误状态，仍然尝试本地验证作为后备
                    const storedPassword = localStorage.getItem('renqing-password') || DEFAULT_PASSWORD;
                    return password === storedPassword;
                }
            } catch (error) {
                console.error('Password verification failed:', error);
                // 如果API不可用，使用本地验证
                const storedPassword = localStorage.getItem('renqing-password') || DEFAULT_PASSWORD;
                return password === storedPassword;
            }
        }

        // 保存密码
        async function savePassword(newPassword, oldPassword = null) {
            try {
                const response = await fetch(`${API_BASE}/api/password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                
                if (response.ok) {
                    const result = await response.json();
                    if (result.success) {
                        // 同时保存到本地存储作为缓存
                        localStorage.setItem('renqing-password', newPassword);
                        localStorage.setItem('renqing-password-changed', 'true');
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.error('密码保存失败:', error);
                // 如果API不可用，只保存到本地
                localStorage.setItem('renqing-password', newPassword);
                localStorage.setItem('renqing-password-changed', 'true');
                return true;
            }
        }

        // 获取存储的密码（主要用于本地验证降级）
        function getStoredPassword() {
            return localStorage.getItem('renqing-password') || DEFAULT_PASSWORD;
        }

        // 检查登录状态
        async function checkLoginStatus() {
            const session = sessionStorage.getItem(SESSION_KEY);
            const passwordStatus = await checkPasswordStatus();
            
            if (session === 'logged-in') {
                showApp();
                if (passwordStatus.isFirstTime) {
                    setTimeout(() => {
                        if (confirm('检测到您是首次使用，默认密码为 "admin"，建议立即修改密码以保证安全。\n\n是否现在修改？')) {
                            logout();
                            showChangePasswordForm();
                        }
                    }, 500);
                }
            } else {
                showLogin();
                if (passwordStatus.isFirstTime) {
                    showMessage('login-message', '欢迎首次使用！默认密码为: admin', 'success');
                }
            }
        }

        // 显示登录页面
        function showLogin() {
            document.getElementById('login-page').style.display = 'flex';
            document.getElementById('change-password-page').style.display = 'none';
            document.getElementById('app-container').style.display = 'none';
            document.body.style.padding = '0';
        }

        // 显示应用
        function showApp() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('change-password-page').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            document.body.style.padding = '20px';
        }

        // 显示修改密码表单
        function showChangePasswordForm() {
            document.getElementById('login-page').style.display = 'none';
            document.getElementById('change-password-page').style.display = 'flex';
            document.getElementById('app-container').style.display = 'none';
            document.body.style.padding = '0';
        }

        // 返回登录
        function backToLogin() {
            showLogin();
            document.getElementById('change-password-form').reset();
            document.getElementById('change-password-message').innerHTML = '';
        }

        // 显示消息
        function showMessage(elementId, message, type = 'error') {
            const messageDiv = document.getElementById(elementId);
            messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
            messageDiv.textContent = message;
        }

        // 处理登录
        async function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            
            console.log('Attempting to login with password:', password);
            
            try {
                const isValid = await verifyPassword(password);
                console.log('Password verification result:', isValid);
                
                if (isValid) {
                    sessionStorage.setItem(SESSION_KEY, 'logged-in');
                    currentPassword = password;
                    document.getElementById('login-form').reset();
                    console.log('Login successful, showing app');
                    loadDataAndShowApp();
                } else {
                    console.log('Login failed: invalid password');
                    showMessage('login-message', '密码错误，请重试');
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                console.error('Login error:', error);
                showMessage('login-message', '登录过程中发生错误，请重试');
            }
            
            return false;
        }

        // 加载数据并显示应用
        async function loadDataAndShowApp() {
            showApp();
            await loadData();
            renderRecords();
            renderStatistics();
            renderGiftBooks();
            updateYearFilter();
            toggleGiftBookSelection();
        }

        // 处理修改密码
        async function handleChangePassword(event) {
            event.preventDefault();
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (!(await verifyPassword(oldPassword))) {
                showMessage('change-password-message', '旧密码错误');
                return false;
            }

            if (newPassword.length < 4) {
                showMessage('change-password-message', '新密码长度至少为4位');
                return false;
            }

            if (newPassword !== confirmPassword) {
                showMessage('change-password-message', '两次输入的密码不一致');
                return false;
            }

            if (await savePassword(newPassword, oldPassword)) {
                showMessage('change-password-message', '密码修改成功！3秒后跳转到登录页面...', 'success');
                
                setTimeout(() => {
                    backToLogin();
                }, 3000);
            } else {
                showMessage('change-password-message', '密码修改失败，请重试');
            }

            return false;
        }

        // 退出登录
        function logout() {
            sessionStorage.removeItem(SESSION_KEY);
            currentPassword = null;
            showLogin();
            document.getElementById('login-message').innerHTML = '';
        }

        // 数据存储（使用API）
        let records = [];
        let giftBooks = [];
        
        // API 基础URL
        const API_BASE = window.location.origin;
        
        // 从服务器加载数据
        async function loadData() {
            try {
                const [recordsRes, giftBooksRes] = await Promise.all([
                    fetch(`${API_BASE}/api/records`),
                    fetch(`${API_BASE}/api/giftbooks`)
                ]);
                
                records = await recordsRes.json();
                giftBooks = await giftBooksRes.json();
                
                console.log('数据加载成功:', { records: records.length, giftBooks: giftBooks.length });
                
                // 使用新算法重新计算所有历史记录的农历日期
                convertHistoricalRecords();
                
            } catch (error) {
                console.error('数据加载失败:', error);
                // 如果API不可用，尝试使用localStorage（向后兼容）
                records = JSON.parse(localStorage.getItem('renqing-records')) || [];
                giftBooks = JSON.parse(localStorage.getItem('renqing-giftbooks')) || [];
                
                // 使用新算法重新计算localStorage中的历史记录
                convertHistoricalRecords();
            }
        }

        // 事由映射
        const eventMap = {
            wedding: '结婚',
            birthday: '生日',
            housewarming: '乔迁',
            baby: '满月/百日',
            visit: '探病',
            funeral: '丧事',
            other: '其他'
        };

        // 动态设置应用版本号
        async function setAppVersion() {
            const titleElement = document.getElementById('app-title');
            if (titleElement) {
                try {
                    // 从后端API获取版本信息
                    const response = await fetch('/api/version');
                    if (response.ok) {
                        const versionInfo = await response.json();
                        titleElement.textContent = `💝 礼记 V${versionInfo.version}`;
                    } else {
                        // 如果API调用失败，使用默认版本
                        titleElement.textContent = `💝 礼记 V1.9.1`;
                    }
                } catch (error) {
                    console.error('获取版本信息失败:', error);
                    // 如果网络错误，使用默认版本
                    titleElement.textContent = `💝 礼记 V1.9.1`;
                }
            }
        }
        
        // 格式化日期显示（公历 + 农历）
        const LUNAR_MONTH_NAMES = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
        const LUNAR_DAY_NAMES = [
            '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
            '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
            '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'
        ];
        const ZODIAC_BY_ZHI = {
            '子': '鼠', '丑': '牛', '寅': '虎', '卯': '兔', '辰': '龙', '巳': '蛇',
            '午': '马', '未': '羊', '申': '猴', '酉': '鸡', '戌': '狗', '亥': '猪'
        };

        function parseChineseNumber(value) {
            if (!value) return null;
            const text = String(value).trim();
            if (/^\d+$/.test(text)) return parseInt(text, 10);

            const digitMap = { '零': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
            if (Object.prototype.hasOwnProperty.call(digitMap, text)) {
                return digitMap[text];
            }
            if (text === '十') return 10;

            if (text.startsWith('廿')) {
                const tail = text.slice(1);
                return 20 + (tail ? (digitMap[tail] || 0) : 0);
            }
            if (text.startsWith('卅')) {
                const tail = text.slice(1);
                return 30 + (tail ? (digitMap[tail] || 0) : 0);
            }
            if (text.includes('十')) {
                const segs = text.split('十');
                const tens = segs[0] ? (digitMap[segs[0]] || 0) : 1;
                const ones = segs[1] ? (digitMap[segs[1]] || 0) : 0;
                return tens * 10 + ones;
            }

            return null;
        }

        function normalizeLunarMonth(monthValue) {
            let monthText = String(monthValue || '').replace(/\s+/g, '');
            if (!monthText) return '';

            const leap = monthText.startsWith('闰');
            if (leap) monthText = monthText.slice(1);

            monthText = monthText.replace(/月/g, '');
            const monthNum = parseChineseNumber(monthText);
            let normalized = '';

            if (monthNum && monthNum >= 1 && monthNum <= 12) {
                normalized = LUNAR_MONTH_NAMES[monthNum - 1];
            } else if (monthText === '正') {
                normalized = '正月';
            } else if (monthText === '冬') {
                normalized = '冬月';
            } else if (monthText === '腊') {
                normalized = '腊月';
            } else if (monthText) {
                normalized = monthText.endsWith('月') ? monthText : `${monthText}月`;
            }

            return leap ? `闰${normalized}` : normalized;
        }

        function normalizeLunarDay(dayValue) {
            const dayText = String(dayValue || '').replace(/\s+/g, '').replace(/[日号]/g, '');
            if (!dayText) return '';
            if (LUNAR_DAY_NAMES.includes(dayText)) return dayText;

            const dayNum = parseChineseNumber(dayText);
            if (dayNum && dayNum >= 1 && dayNum <= 30) {
                return LUNAR_DAY_NAMES[dayNum - 1];
            }
            return dayText;
        }

        function formatDateWithLunar(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            if (Number.isNaN(date.getTime())) {
                return dateStr || '';
            }

            const solarDate = date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            try {
                const lunarFormatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const parts = lunarFormatter.formatToParts(date);
                const relatedYear = (parts.find(part => part.type === 'relatedYear')?.value || '').replace(/[^\d]/g, '');
                const yearName = (parts.find(part => part.type === 'yearName')?.value || '').replace(/[年\s]/g, '');
                const lunarMonth = normalizeLunarMonth(parts.find(part => part.type === 'month')?.value || '');
                const lunarDay = normalizeLunarDay(parts.find(part => part.type === 'day')?.value || '');
                const zodiac = ZODIAC_BY_ZHI[yearName.slice(-1)] || '';

                if (relatedYear && yearName && lunarMonth && lunarDay) {
                    return `${solarDate}（农历${relatedYear}${yearName}${zodiac}年${lunarMonth}${lunarDay}）`;
                }

                const lunarDate = lunarFormatter.format(date).replace(/\s+/g, '');
                return `${solarDate}（农历${lunarDate}）`;
            } catch (error) {
                // Browser/runtime does not support chinese calendar in Intl.
                return solarDate;
            }
        }
        
        // 批量转换历史记录中的日期
        function convertHistoricalRecords() {
            if (!records || !Array.isArray(records)) return;
            
            for (const record of records) {
                if (record.date) {
                    record.formattedDate = formatDateWithLunar(record.date);
                }
            }
            
            if (!giftBooks || !Array.isArray(giftBooks)) return;
            
            for (const book of giftBooks) {
                if (book.date) {
                    book.formattedDate = formatDateWithLunar(book.date);
                }
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async function() {
            // 动态设置版本号
            await setAppVersion();
            
            // 检查登录状态
            checkLoginStatus();
            
            // 如果已登录，加载数据
            const session = sessionStorage.getItem(SESSION_KEY);
            if (session === 'logged-in') {
                // 加载数据
                await loadData();
                
                // 设置今天的日期
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('gb-date').valueAsDate = new Date();
                
                // 渲染记录列表
                renderRecords();
                renderStatistics();
                renderGiftBooks();
                updateYearFilter();
                
                // 初始化礼薄选择显示状态
                toggleGiftBookSelection();
                
                // 点击页面其他地方关闭联想提示
                document.addEventListener('click', function(e) {
                    // 关闭添加记录的联想提示
                    if (e.target.id !== 'name') {
                        const suggestions = document.getElementById('contact-suggestions');
                        if (suggestions) {
                            suggestions.style.display = 'none';
                        }
                    }
                    // 关闭宾客联想提示
                    if (!e.target.id.startsWith('guest-name-')) {
                        document.querySelectorAll('.guest-suggestions').forEach(div => {
                            div.style.display = 'none';
                        });
                    }
                });
            }
        });

        // 显示联系人建议
        function showContactSuggestions() {
            const input = document.getElementById('name');
            const searchText = input.value.trim().toLowerCase();
            const suggestionsDiv = document.getElementById('contact-suggestions');
            
            if (!searchText) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            
            // 从所有记录中提取唯一的联系人
            const contactsMap = {};
            records.forEach(record => {
                const name = record.name;
                if (name.toLowerCase().includes(searchText)) {
                    if (!contactsMap[name]) {
                        contactsMap[name] = {
                            name: name,
                            relationship: record.relationship || '未知',
                            lastEvent: record.event,
                            count: 0
                        };
                    }
                    contactsMap[name].count++;
                }
            });
            
            const matches = Object.values(contactsMap);
            
            if (matches.length === 0) {
                suggestionsDiv.style.display = 'none';
                return;
            }
            
            // 显示建议列表
            suggestionsDiv.innerHTML = matches.map(contact => `
                <div class="suggestion-item" onclick="selectContact('${contact.name}', '${contact.relationship}')">
                    <div class="suggestion-name">${contact.name}</div>
                    <div class="suggestion-info">${contact.relationship} · 往来${contact.count}次 · 最近：${eventMap[contact.lastEvent]}</div>
                </div>
            `).join('');
            
            suggestionsDiv.style.display = 'block';
            
            // 设置位置（相对于输入框）
            const inputRect = input.getBoundingClientRect();
            suggestionsDiv.style.width = inputRect.width + 'px';
        }

        // 选择联系人
        function selectContact(name, relationship) {
            document.getElementById('name').value = name;
            if (relationship && relationship !== '未知') {
                document.getElementById('relationship').value = relationship;
            }
            document.getElementById('contact-suggestions').style.display = 'none';
        }

        // 更新年份筛选器
        function updateYearFilter() {
            const years = new Set();
            records.forEach(record => {
                const year = new Date(record.date).getFullYear();
                years.add(year);

                    method: 'POST',

                });
                
                if (response.ok) {

                    console.error('记录保存失败，HTTP状态码:', response.status);

        // 导出记录为Excel (CSV格式)
        function exportToExcel() {
            if (records.length === 0) {
                alert('没有记录可导出');
                return;
            }
            
            const eventMap = {
                wedding: '结婚',
                birthday: '生日',
                moving: '乔迁',
                baby: '满月/百日',
                visit: '探病',
                funeral: '丧事',
                other: '其他'
            };
            
            // CSV表头
            const headers = ['姓名', '类型', '金额', '事由', '日期', '关系', '地点', '备注'];
            
            // CSV数据行
            const rows = records.map(record => {
                return [
                    record.name,
                    record.type === 'received' ? '收礼' : '送礼',
                    record.amount,
                    eventMap[record.event] || record.event,
                    record.date,
                    record.relationship || '',
                    record.location || '',
                    record.notes || ''
                ].map(field => {
                    // 处理特殊字符
                    const str = String(field).replace(/"/g, '""');
                    return `"${str}"`;
                }).join(',');
            });
            
            // 组合CSV内容，添加BOM以支持中文
            const csvContent = '\uFEFF' + headers.join(',') + '\n' + rows.join('\n');
            
            // 创建下载链接
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `礼记_记录列表_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            alert(`成功导出 ${records.length} 条记录！`);
        }
        
        // 从Excel导入记录
        function importFromExcel(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const content = e.target.result;
                    const lines = content.split('\n').filter(line => line.trim());
                    
                    if (lines.length < 2) {
                        alert('文件为空或格式不正确');
                        return;
                    }
                    
                    // 解析表头
                    const headers = parseCSVLine(lines[0]);
                    const nameIdx = headers.findIndex(h => h.includes('姓名'));
                    const typeIdx = headers.findIndex(h => h.includes('类型'));
                    const amountIdx = headers.findIndex(h => h.includes('金额'));
                    const eventIdx = headers.findIndex(h => h.includes('事由'));
                    const dateIdx = headers.findIndex(h => h.includes('日期'));
                    const relIdx = headers.findIndex(h => h.includes('关系'));
                    const locIdx = headers.findIndex(h => h.includes('地点'));
                    const noteIdx = headers.findIndex(h => h.includes('备注'));
                    
                    if (nameIdx === -1 || amountIdx === -1) {
                        alert('文件格式不正确，请确保包含"姓名"和"金额"列');
                        return;
                    }
                    
                    const eventReverseMap = {
                        '结婚': 'wedding',
                        '生日': 'birthday',
                        '乔迁': 'moving',
                        '满月/百日': 'baby',
                        '满月': 'baby',
                        '百日': 'baby',
                        '探病': 'visit',
                        '丧事': 'funeral',
                        '其他': 'other'
                    };
                    
                    let importedCount = 0;
                    let skippedCount = 0;
                    
                    for (let i = 1; i < lines.length; i++) {
                        const values = parseCSVLine(lines[i]);
                        if (values.length < 2) continue;
                        
                        const name = values[nameIdx]?.trim();
                        const amount = parseFloat(values[amountIdx]);
                        
                        if (!name || isNaN(amount)) {
                            skippedCount++;
                            continue;
                        }
                        
                        const typeStr = values[typeIdx]?.trim() || '收礼';
                        const eventStr = values[eventIdx]?.trim() || '其他';
                        const dateStr = values[dateIdx]?.trim() || new Date().toISOString().split('T')[0];
                        
                        const newRecord = {
                            id: Date.now() + i,
                            name: name,
                            type: typeStr.includes('送') ? 'given' : 'received',
                            amount: amount,
                            event: eventReverseMap[eventStr] || 'other',
                            date: dateStr,
                            relationship: values[relIdx]?.trim() || '',
                            location: values[locIdx]?.trim() || '',
                            notes: values[noteIdx]?.trim() || ''
                        };
                        
                        records.push(newRecord);
                        importedCount++;
                    }
                    
                    if (importedCount > 0) {
                        // 保存到服务器
                        await fetch('/api/records', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(records)
                        });
                        
                        renderRecords();
                        updateYearFilter();
                        updateStats();
                        
                        alert(`成功导入 ${importedCount} 条记录！${skippedCount > 0 ? `\n跳过 ${skippedCount} 条无效记录` : ''}`);
                    } else {
                        alert('没有找到有效的记录数据');
                    }
                } catch (err) {
                    console.error('导入失败:', err);
                    alert('导入失败，请检查文件格式');
                }
            };
            
            reader.readAsText(file, 'UTF-8');
            // 重置文件输入，以便可以重复选择同一文件
            event.target.value = '';
        }
        
        // 解析CSV行（处理引号和逗号）
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            
            return result;
        }

        // 过滤记录
        function filterRecords() {
            const typeFilter = document.getElementById('filter-type').value;
            const yearFilter = document.getElementById('filter-year').value;
            const searchName = document.getElementById('search-name').value.toLowerCase();
            
            let filtered = records.filter(record => {
                const matchType = typeFilter === 'all' || record.type === typeFilter;
                const recordYear = new Date(record.date).getFullYear().toString();
                const matchYear = yearFilter === 'all' || recordYear === yearFilter;
                const matchName = record.name.toLowerCase().includes(searchName);
                return matchType && matchYear && matchName;
            });
            
            renderRecords(filtered);
        }

        // 保存编辑
        function saveEdit(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;
            
            const oldGiftBookId = record.giftBookId;
            const oldAmount = record.amount;
            const oldName = record.name;
            const oldRelationship = record.relationship;
            
            // 更新记录
            record.name = document.getElementById(`edit-name-${id}`).value;
            record.amount = parseFloat(document.getElementById(`edit-amount-${id}`).value);
            record.date = document.getElementById(`edit-date-${id}`).value;
            record.event = document.getElementById(`edit-event-${id}`).value;
            record.relationship = document.getElementById(`edit-relationship-${id}`).value;
            record.location = document.getElementById(`edit-location-${id}`).value;
            record.notes = document.getElementById(`edit-notes-${id}`).value;
            
            // 处理礼薄关联变更
            if (record.type === 'received') {
                const newGiftBookId = document.getElementById(`edit-giftbook-${id}`).value || null;
                
                // 如果礼薄发生变化
                if (oldGiftBookId != newGiftBookId) {
                    // 从旧礼薄删除
                    if (oldGiftBookId) {
                        const oldBook = giftBooks.find(b => b.id == oldGiftBookId);
                        if (oldBook) {
                            oldBook.guests = oldBook.guests.filter(g => g.id !== id);
                        }
                    }
                    
                    // 添加到新礼薄
                    if (newGiftBookId) {
                        const newBook = giftBooks.find(b => b.id == newGiftBookId);
                        if (newBook) {
                            const guest = {
                                id: id,
                                name: record.name,
                                amount: record.amount,
                                relationship: record.relationship || ''
                            };
                            newBook.guests.push(guest);
                        }
                    }
                    
                    record.giftBookId = newGiftBookId;
                    saveGiftBooks();
                } else if (oldGiftBookId) {
                    // 礼薄未变，但更新礼薄中的宾客信息
                    const book = giftBooks.find(b => b.id == oldGiftBookId);
                    if (book) {
                        const guest = book.guests.find(g => g.id === id);
                        if (guest) {
                            guest.name = record.name;
                            guest.amount = record.amount;
                            guest.relationship = record.relationship || '';
                        }
                        saveGiftBooks();
                    }
                }
            }
            
            saveRecords();
            cancelEdit(id);
            alert('✅ 修改已保存！');
        }

        // 删除记录
        function deleteRecord(id) {
            if (confirm('确定要删除这条记录吗？')) {
                const record = records.find(r => r.id === id);
                
                // 如果记录关联了礼薄，同时从礼薄中删除
                if (record && record.giftBookId) {
                    const book = giftBooks.find(b => b.id == record.giftBookId);
                    if (book) {
                        book.guests = book.guests.filter(g => g.id !== id);
                        saveGiftBooks();
                    }
                }
                
                records = records.filter(r => r.id !== id);
                saveRecords();
            }
        }

                    <div class="stat-value">${balance >= 0 ? '+' : ''}¥${balance.toFixed(2)}</div>

        }

        // 渲染详细统计
        function renderDetailedStats() {
            renderYearStats();
            renderEventStats();
        }

        // 渲染年份统计
        function renderYearStats() {
            const yearStatsMap = {};
            
            records.forEach(record => {
                const year = new Date(record.date).getFullYear();
                if (!yearStatsMap[year]) {
                    yearStatsMap[year] = {
                        received: 0,
                        given: 0,
                        count: 0
                    };
                }
                
                if (record.type === 'received') {
                    yearStatsMap[year].received += record.amount;
                } else {
                    yearStatsMap[year].given += record.amount;
                }
                yearStatsMap[year].count++;
            });
            
            const yearStatsContainer = document.getElementById('year-stats');
            
            if (Object.keys(yearStatsMap).length === 0) {
                yearStatsContainer.innerHTML = '<p style="color: #999;">暂无数据</p>';
                return;
            }
            
            const years = Object.keys(yearStatsMap).sort((a, b) => b - a);
            
            yearStatsContainer.innerHTML = years.map(year => {
                const stats = yearStatsMap[year];
                const balance = stats.received - stats.given;
                
                return `
                    <div class="year-stat-card" onclick="showYearEventStats('${year}')" id="year-card-${year}">
                        <div class="year-stat-year">${year} 年</div>
                        <div class="year-stat-amount" style="color: #52c41a;">收入 ¥${stats.received.toFixed(2)}</div>
                        <div class="year-stat-amount" style="color: #ff4757;">支出 ¥${stats.given.toFixed(2)}</div>
                        <div class="year-stat-amount" style="color: ${balance >= 0 ? '#52c41a' : '#ff4757'};">
                            余额 ${balance >= 0 ? '+' : ''}¥${balance.toFixed(2)}
                        </div>
                        <div class="year-stat-count">${stats.count} 笔记录</div>
                    </div>
                `;
            }).join('');
        }

        // 渲染事由统计
        function renderEventStats(year = null) {
            // 过滤记录
            let filteredRecords = records;
            if (year) {
                filteredRecords = records.filter(r => new Date(r.date).getFullYear().toString() === year);
            }
            
            // 按事由统计
            const eventStats = {};
            Object.keys(eventMap).forEach(key => {
                eventStats[key] = {
                    received: 0,
                    given: 0,
                    count: 0
                };
            });

            filteredRecords.forEach(record => {
                if (record.type === 'received') {
                    eventStats[record.event].received += record.amount;
                } else {
                    eventStats[record.event].given += record.amount;
                }
                eventStats[record.event].count++;
            });

            const detailedStatsContainer = document.getElementById('detailed-stats');
            detailedStatsContainer.innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #f0f0f0;">
                            <th style="padding: 12px; text-align: left; border: 1px solid #e0e0e0;">事由</th>
                            <th style="padding: 12px; text-align: right; border: 1px solid #e0e0e0;">收入</th>
                            <th style="padding: 12px; text-align: right; border: 1px solid #e0e0e0;">支出</th>
                            <th style="padding: 12px; text-align: right; border: 1px solid #e0e0e0;">笔数</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${Object.entries(eventStats).map(([key, stats]) => `
                            <tr>
                                <td style="padding: 12px; border: 1px solid #e0e0e0;">${eventMap[key]}</td>
                                <td style="padding: 12px; text-align: right; color: #52c41a; border: 1px solid #e0e0e0;">
                                    ¥${stats.received.toFixed(2)}
                                </td>
                                <td style="padding: 12px; text-align: right; color: #ff4757; border: 1px solid #e0e0e0;">
                                    ¥${stats.given.toFixed(2)}
                                </td>
                                <td style="padding: 12px; text-align: right; border: 1px solid #e0e0e0;">
                                    ${stats.count}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }

        // 显示指定年份的事由统计
        function showYearEventStats(year) {
            // 更新标题
            document.getElementById('event-stats-title').textContent = `📊 事由统计（${year} 年）`;
            
            // 移除所有年份卡片的激活状态
            document.querySelectorAll('.year-stat-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // 激活当前年份卡片
            const yearCard = document.getElementById(`year-card-${year}`);
            if (yearCard) {
                yearCard.classList.add('active');
            }
            
            // 渲染该年份的事由统计
            renderEventStats(year);
            
            // 滚动到事由统计区域
            document.getElementById('event-stats-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 切换统计视图
        function showStatsView(view) {
            if (view === 'summary') {
                document.getElementById('summary-view').style.display = 'block';
                document.getElementById('contacts-view').style.display = 'none';
            } else if (view === 'contacts') {
                document.getElementById('summary-view').style.display = 'none';
                document.getElementById('contacts-view').style.display = 'block';
                renderContacts();
            }
        }

        // 排序亲友录
        let contactsSortField = null;
        let contactsSortAsc = true;
        let collapsedGroups = {}; // 记录折叠状态，默认全部折叠
        
        function sortContacts(field) {
            // 切换排序字段
            if (contactsSortField === field) {
                contactsSortAsc = !contactsSortAsc;
            } else {
                contactsSortField = field;
                contactsSortAsc = true;
            }
            
            // 重新渲染
            const searchText = document.getElementById('contact-search').value;
            renderContacts(searchText);
        }
        
        // 切换关系分组的展开/折叠状态
        function toggleContactGroup(relationship) {
            collapsedGroups[relationship] = !collapsedGroups[relationship];
            const listEl = document.getElementById(`contact-list-${relationship}`);
            const arrowEl = document.getElementById(`arrow-${relationship}`);
            if (collapsedGroups[relationship]) {
                listEl.style.display = 'none';
                arrowEl.textContent = '▶';
            } else {
                listEl.style.display = 'block';
                arrowEl.textContent = '▼';
            }
        }

        // 渲染亲友录
        function renderContacts(searchText = '') {
            const contactsMap = {};
            
            // 统计每个人的收支情况
            records.forEach(record => {
                const name = record.name;
                if (!contactsMap[name]) {
                    contactsMap[name] = {
                        name: name,
                        relationship: record.relationship || '其他',
                        received: 0,
                        given: 0,
                        receivedCount: 0,
                        givenCount: 0,
                        records: []
                    };
                }
                
                if (record.type === 'received') {
                    contactsMap[name].received += record.amount;
                    contactsMap[name].receivedCount++;
                } else {
                    contactsMap[name].given += record.amount;
                    contactsMap[name].givenCount++;
                }
                
                contactsMap[name].records.push(record);
            });
            
            // 转换为数组并按关系分组
            const contacts = Object.values(contactsMap);
            
            // 过滤搜索
            const filteredContacts = searchText 
                ? contacts.filter(c => c.name.toLowerCase().includes(searchText.toLowerCase()))
                : contacts;
            
            // 按关系分组
            const groupedContacts = {};
            filteredContacts.forEach(contact => {
                const rel = contact.relationship || '其他';
                if (!groupedContacts[rel]) {
                    groupedContacts[rel] = [];
                }
                groupedContacts[rel].push(contact);
            });
            
            // 排序（在分组前）
            if (contactsSortField) {
                filteredContacts.sort((a, b) => {
                    let aVal, bVal;
                    if (contactsSortField === 'name') {
                        aVal = a.name.toLowerCase();
                        bVal = b.name.toLowerCase();
                        return contactsSortAsc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
                    } else if (contactsSortField === 'amount') {
                        aVal = a.received + a.given;
                        bVal = b.received + b.given;
                        return contactsSortAsc ? aVal - bVal : bVal - aVal;
                    }
                });
                
                // 重新分组
                const newGrouped = {};
                filteredContacts.forEach(contact => {
                    const rel = contact.relationship || '其他';
                    if (!newGrouped[rel]) {
                        newGrouped[rel] = [];
                    }
                    newGrouped[rel].push(contact);
                });
                Object.assign(groupedContacts, newGrouped);
            }
            
            const container = document.getElementById('contacts-container');
            
            if (filteredContacts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p style="font-size: 48px;">👥</p>
                        <p style="font-size: 18px; margin-top: 10px;">${searchText ? '未找到匹配的亲友' : '暂无亲友记录'}</p>
                    </div>
                `;
                return;
            }
            
            // 按关系排序（常见关系在前）
            const relationshipOrder = ['亲戚', '朋友', '同事', '同学', '邻居', '其他'];
            const sortedGroups = Object.keys(groupedContacts).sort((a, b) => {
                const indexA = relationshipOrder.indexOf(a);
                const indexB = relationshipOrder.indexOf(b);
                if (indexA === -1 && indexB === -1) return a.localeCompare(b);
                if (indexA === -1) return 1;
                if (indexB === -1) return -1;
                return indexA - indexB;
            });
            
            container.innerHTML = sortedGroups.map(relationship => {
                const groupContacts = groupedContacts[relationship];
                const totalCount = groupContacts.length;
                
                // 如果没有记录过折叠状态，默认为折叠
                if (collapsedGroups[relationship] === undefined) {
                    collapsedGroups[relationship] = true;
                }
                const isCollapsed = collapsedGroups[relationship];
                const arrow = isCollapsed ? '▶' : '▼';
                
                return `
                    <div class="contact-group">
                        <div class="contact-group-title" style="cursor: pointer; user-select: none;" onclick="toggleContactGroup('${relationship}')">
                            <span><span id="arrow-${relationship}" style="display: inline-block; width: 20px;">${arrow}</span>${relationship}</span>
                            <span>${totalCount} 人</span>
                        </div>
                        <div class="contact-list" id="contact-list-${relationship}" style="display: ${isCollapsed ? 'none' : 'block'};">
                            ${groupContacts.map(contact => {
                                const balance = contact.received - contact.given;
                                const balanceClass = balance > 0 ? 'positive' : balance < 0 ? 'negative' : '';
                                
                                return `
                                    <div class="contact-item" onclick="showContactDetail('${contact.name}')">
                                        <div class="contact-name">👤 ${contact.name}</div>
                                        <div class="contact-stats">
                                            <span style="color: #52c41a;">收 ${contact.receivedCount}</span>
                                            <span style="color: #ff4757;">送 ${contact.givenCount}</span>
                                        </div>
                                        <div class="contact-balance ${balanceClass}">
                                            余额: ${balance >= 0 ? '+' : ''}¥${balance.toFixed(2)}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 过滤亲友
        function filterContacts() {
            const searchText = document.getElementById('contact-search').value;
            renderContacts(searchText);
        }

                                ${record.notes ? `<div>备注: ${record.notes}</div>` : ''}

            const modal = document.getElementById('contact-modal');
            const modalContentDiv = document.getElementById('contact-modal-content');
            modalContentDiv.innerHTML = modalContent;
            modal.classList.add('show');
